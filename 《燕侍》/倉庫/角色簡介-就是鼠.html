<h1 style="text-align: center;">《就是鼠》</h1><hr class="b002">
<li><a>名稱：就是鼠</a></li>
<li><a>代表色：青色</a></li>
<P>
簡介：<br>
由於《鼠鼠伊甸》遭遇了「異變」迫使，大量的鼠民們散落在世界各地。<br>
為了重建《鼠鼠伊甸》又不重蹈覆轍，則新建一個《鼠托邦》將是目標。<br>
但是憑一人之力是無法建構理想鄉，所以踏上了組建《鼠鼠戰團》之路。<br>
</P>
