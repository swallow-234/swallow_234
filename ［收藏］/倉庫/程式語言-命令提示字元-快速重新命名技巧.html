        <!--標題-->
        <h1 style="text-align: center;">《程式語言-命令提示字元-快速重新命名技巧》</h1>
<!--內文-->
<div style="color:#B7B7B7">
    <p><h3>執行檔</h3></p><hr class="a002">
<pre><code>
1.在一個資料夾內，選取全部文件。
2.右鍵複製路徑。
3.貼上至[記事本]表格/文檔編輯。

4.文字「前墜」指令：ren。原始檔名.格式。更改檔名.格式。
範例：ren "原始檔名.格式" "更改檔名.格式"
ren "45345.webp" "東方-事件-紅魔館又爆炸啦！-45345.webp"

5.儲存文件，在同一個資料夾內。 
名稱.bat 
編碼：ANSI(繁體中文 Big5 )。

6.於資料夾內執行，剛剛儲存的執行檔。
</code></pre>    
    </body>
</html>
