<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《藝術學院》</title>
    <link href="../A0001.css" rel="stylesheet" />
    <script src="../公佈欄-搜尋.js"></script>
    <script src="../公佈欄-搜尋 -資料庫.js"></script>
    <style>
        /* 暗黑高質感風格 */
        body {
            padding: 20px; /* 留 */
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="professor-box">
        <p id="professor-status">《藝術學院》</p>
    </div>

    <div class="filter-bar1">
        <input type="text" id="searchInput" placeholder="搜尋" onkeyup="filterData()">
        
        <select id="areaFilter" onchange="updateCategories()">
            <option value=" ">系列勢力</option>
            <option value=" ">全部</option>
            <option value="藝術學院">藝術學院</option>
        </select>
        
        <select id="catFilter" onchange="filterData()">
            <option value=" ">主題</option>
            <option value=" ">全部</option>
            <option value="劇本">劇本</option>
            <option value="繪圖">繪圖</option>
            <option value="動畫">動畫</option>
            <option value="3D">3D</option>
            <option value="攝影|影片|剪輯">攝影|影片|剪輯</option>
            <option value="舞蹈|動作|武術">舞蹈|動作|武術</option>
            <option value="樂理|配樂|音效">樂理|配樂|音效</option>
        </select>
        
        <select id="rarityFilter" onchange="filterData()">
            <option value=" ">稀有度</option>
            <option value=" ">全部</option>
            <option value="傳奇">傳奇</option>
            <option value="稀有">稀有</option>
            <option value="魔法">魔法</option>
            <option value="一般">一般</option>
        </select>
        
        <select id="prefixFilter" onchange="filterData()">
            <option value=" ">前綴</option>
            <option value=" ">全部</option>
        </select>
        
        <select id="suffixFilter" onchange="filterData()">
            <option value=" ">後綴</option>
            <option value=" ">全部</option>
        </select>
    </div>

    <div id="section-table2" class="table-section">
        <h3><a href="https://swallow-234.github.io/swallow_234/%EF%BC%BB%E6%94%B6%E8%97%8F%EF%BC%BD/%E8%97%9D%E8%A1%93%E5%AD%B8%E9%99%A2-%E7%AF%84%E6%9C%AC.html">☯</a>《收藏清單》：動態更新調整．．．</h3>
        <table class="tt">
            <thead>
                <tr>
                    <th>更新日期</th>
                    <th>連結</th>
                    <th>系列勢力</th>
                    <th>主題</th>
                    <th>標題</th>
                    <th>稀有度</th>
                    <th>前綴</th>
                    <th>後綴</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>版本更新</td>
                    <td><a href="https://www.blender.org/">網址</a></td>
                    <td>blender</td>
                    <td>使用軟體</td>
                    <td></td>
                    <td class="rare-一般">一般</td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>版本更新</td>
                    <td><a href="https://krita.org/zh-tw/download_zh-tw/krita-desktop_zh-tw/">網址</a></td>
                    <td>Krita</td>
                    <td>使用軟體</td>
                    <td></td>
                    <td class="rare-一般">一般</td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>
        <p>公告：無<BR>
           備註：無<BR>
        </p>
    </div>

    <div id="section-search-results" class="table-section hidden">
        <h3>搜尋結果符合的《收藏清單》</h3>
        <table class="tt">
            <thead>
                <tr>
                    <th>更新日期</th>
                    <th>☯</th>
                    <th>系列情勢</th>
                    <th>主題</th>
                    <th>標題</th>
                    <th>稀有度</th>
                    <th>前綴</th>
                    <th>後綴</th>
                </tr>
            </thead>
            <tbody id="results-body">
                </tbody>
        </table>
    </div>
</div>

</html>
