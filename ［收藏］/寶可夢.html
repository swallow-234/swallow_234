<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>《寶可夢》</title>
    <link href="../A0001.css" rel="stylesheet" />

    <style>
        /* 暗黑高質感風格 */
        body {
            padding: 20px; /* 留 */

<body>

<div class="container">
    
    <div class="professor-box">
        <p id="professor-status">《寶可夢》<br>尋找的旅途中，期待與妳相遇。</p>

    <div class="filter-bar1">

        <select id="areaFilter" onchange="updateCategories()">
            <option value=" ">系列勢力</option>
            <option value=" ">全部</option>
            <option value="初階">初階</option>
            <option value="進化Ⅰ">進化Ⅰ</option>
            <option value="進化Ⅱ">進化Ⅱ</option>
            <option value="進化Ⅲ">進化Ⅲ</option>
        </select>
        
        <select id="catFilter" onchange="filterData()">
            <option value=" ">屬性</option>
            <option value=" ">全部</option>
            <option value="一般">一般</option>
            <option value="冰">冰</option>
            <option value="地面">地面</option>
            <option value="妖精">妖精</option>
            <option value="岩石">岩石</option>

            <option value="電">電</option>
            <option value="飛行">飛行</option>
            <option value="龍">龍</option>
        </select>
        
        <select id="rarityFilter" onchange="filterData()">
            <option value=" ">喜愛度</option>
            <option value=" ">全部</option>
            <option value="喜歡的">喜歡的</option>
            <option value="帥氣的">帥氣的</option>
        </select>
        
        <select id="prefixFilter" onchange="filterData()">
            <option value=" ">前綴</option>
            <option value=" ">全部</option>
        </select>
        
        <select id="suffixFilter" onchange="filterData()">
            <option value=" ">後綴</option>
            <option value=" ">全部</option>
        </select>
    </div>

    <div id="section-table2" class="table-section">
        <h3><a href="https://swallow-234.github.io/swallow_234/［收藏］/寶可夢.html">☯</a>《訓練家》：我帶精靈球機槍塔來了．．．</h3>
        <table class="tt">
            <thead>
                <tr>
                    <th>圖鑑編號</th>
                    <th>補給站</th>
                    <th>系列勢力</th>
                    <th>主題</th>
                    <th>名稱</th>
                    <th>重要性</th>
                    <th>前綴</th>
                    <th>後綴</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>No.0001</td>
                    <td><a href="https://tw.portal-pokemon.com/play/pokedex/">補給</a></td>
                    <td>《寶可夢圖鑑》</td>
                    <td>性質</td>
                    <td>名稱</td>
                    <td class="rare-傳奇">傳奇</td>

        <p>備註：此為「個人」喜好收藏清單。</p>
